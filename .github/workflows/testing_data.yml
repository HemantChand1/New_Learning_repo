name: testing-data

on: 
  push
  

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest

    steps:
      - name: This is the First test
        run: echo "This is the testing process"
      - name: data background
        run: |
          pwd
          ls -al
          df -h
      - name: Adding files
        run: |
          mkdir data
          echo "this is the testing for the 1st user " >> Temp.txt
          echo "this is a demo to test the release " >> data.txt
          echo "this is going to be ok in the folder" >> data/ping.txt
      - name: upload single_files
        uses: actions/upload-artifact@v7 
        with:
          name: Single-files
          path: |
            ./Temp.txt
            ./data.txt

      - name: upload Folder
        uses: actions/upload-artifact@v7 
          
        with:
          name: folder_path
          path: 
            ./data/
    
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Check the current files in the system
        run: |
          ls -la
          pwd

  job3:
    name: JOB3
    needs: [job1, job2]
    runs-on: ubuntu-latest

    steps:
      - name: Download a Build Artifact1
        uses: actions/download-artifact@v7.0.0 #git market place
        with:
          name: Single-files
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v7.0.0 #git market place
        with:         
          name: folder_path
      - name: checking current directory post download
        run: |
          pwd
          ls -al


  job4:
    name: JOB4
    needs: [job1, job2, job3]
    runs-on: ubuntu-latest

    steps:
      - name: This is to downlod the repo files we created 
        uses: actions/download-artifact@v8
        with:
          name: Single-files

      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: folder_path
  
  job5:
    name: JOB5
    needs: [job1, job2, job3, job4]
    runs-on: ubuntu-latest
    steps:
      - name: this is to checkout 
        uses: actions/checkout@v6.1.0

      - name: Check the current files in the system
        run: |
          ls -la
          pwd


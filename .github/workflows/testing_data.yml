name: testing-data

on: 
  push
  

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest

    steps:
      - name: This is the First test
        run: echo "This is the testing process"
      - name: data background
        run: |
          pwd
          ls -al
          df -h
      - name: Adding files
        run: |
          echo "this is the testing for the 1st user " >> Temp.txt
          echo "this is a demo to test the release " >> data.txt
          mkdir data
          echo "this is going to be ok in the folder" >> /data/ping.txt
      - name: upload single_files
        uses: actions/upload-artifact@v7 
        with:
          name: Single-files
          path: |
            ./Temp.txt
            ./data.txt

      - name: upload Folder
        uses: actions/upload-artifact@v7 
          
        with:
          name: folder_path
          path: /data/
    
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Check the current files in the system
        run: |
          ls -la
          pwd

  job3:
    name: JOB3
    needs: [job1, job2]
    runs-on: ubuntu-latest

    steps:
      - name: upload single_file
        uses: actions/upload-artifact@v7 
        with:
          name: Single-files
          path: |
            ./Temp.txt
            ./data.txt
            
      - name: checking the data 
        run: | 
          pwd
          ls -al
          

name: my-first-workflow
#To get the workflow triggeered at every push
on: 
 push:
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    
    steps:
      - name: Running single command in JOB1
        run: echo "Hi this is Hemant's workdlow"
      - name: check1
        run: |
          pwd
          ls -al
          hostname
      - name: Step 2 Checkout
        uses: actions/checkout@v6.1.0 #git market place

      - name: Step 3 Check
        run: |
          mkdir archive1
          pwd
          ls -al
          hostname
          echo "this is the artifact" >> myfact.txt
          echo "This is an aftifact file to be tested" >> archive1/mai1l.txt
          echo "This will be the 3rd file to be tested in this manner" >> archive1/mai1n.txt

      - name: upload multiple artifact
        uses: actions/upload-artifact@v7  # git market place
        with:
          name: multiple_path
          path: |
            ./myfact.txt
            archive1/
         
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Checking the current directory
        run: |
          pwd
          ls -al

      - name: Download a Build Artifact
        uses: actions/download-artifact@v7.0.0 #git market place
        with:
          name: single_path
      - name: checking current directory post download
        run: |
          pwd
          ls -al

  job3:
    name: JOB3
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Checking current directory
        run: |
          pwd
          ls -al

      - name: Download directory
        uses: actions/download-artifact@v7.0.0 # git market place
        with:
          name: multiple_path
      - name: checking current directory post download
        run: |
          pwd
          ls -al

  job4:
    name: JOB4
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Creating custome file and folder
        run: |
          mkdir single_file
          mkdir download_directory
      - name: Checking current directory
        run: |
          pwd
          ls -al

      - name: Download a single file Artifact
        uses: actions/download-artifact@v7.0.0 #git market place
        with:
          name: single_path
          path: single_file

      - name: Download directory
        uses: actions/download-artifact@v7.0.0 # git market place
        with:
          name: multiple_path
          path: download_directory
      - name: checking current directory post download
        run: |
          pwd
          echo "this is the single file"
          ls -al single_file
          echo "this is the single directory"
          ls -al download_directory
